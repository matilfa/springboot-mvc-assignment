<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Books</title>
    </head>
    <body>
        <h1>The Book Club Library</h1>

        <ul>
            <li th:each="book : ${books}">
                Title: <span th:text="${book.title}">Title</span><br>
                Author: <span th:text="${book.author}">Author</span><br>
                Genre: <span th:text="${book.genre}">Genre</span><br>
            </li>
        </ul>
        <ul>
            <li><a href="/books">Go to library</a></li>
            <li><a href="/genre">Go to genre search</a></li>
            <li><a href="/home">Go to home page</a></li>
        </ul>
    </body>
</html>
