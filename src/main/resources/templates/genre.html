<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Genre search</title>
</head>
<body>
<form th:action="@{/genre}" method="get">
    Genre:<input type="text" th:value="${type}" name="type"/>
    <button type="submit">Search</button>
    <ul>
        <li th:each="book : ${books}">
            Title: <span th:text="${book.title}">Title</span><br>
            Author: <span th:text="${book.author}">Author</span><br>
            Genre: <span th:text="${book.genre}">Genre</span><br>
        </li>
    </ul>
    <p th:text="${errorMessage}"></p>
    <ul>
        <li><a href="/books">Go to library</a></li>
        <li><a href="/genre">Go to genre search</a></li>
        <li><a href="/home">Go to home page</a></li>
    </ul>
</form>
</body>
</html>
